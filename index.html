<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YorrOfficial V7 - Game Center</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#0f0f0f;color:#fff}
.header{position:relative;z-index:2;text-align:center;padding:24px;background:#000000aa;backdrop-filter:blur(10px)}
.header h1{font-size:38px;font-weight:900;color:#FFD700}
.bento{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:26px;padding:18px}
.card.full{grid-column:1 / span 2}
.gold{background:linear-gradient(135deg,#FFD700,#FFE88A) !important;color:#000 !important}
.btn{width:100%;padding:13px;border-radius:100px;border:none;font-weight:900;margin-top:8px}
.btn-gold{background:#FFD700;color:#000}
.btn-dark{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.2)}
.game-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.game-item{background:#000;border:1px solid #FFD70055;border-radius:18px;padding:14px;text-align:center;cursor:pointer}
.game-item.active{background:#FFD700;color:#000}
.game-box{width:100%;height:280px;background:#000;border-radius:20px;margin-top:12px;position:relative;overflow:hidden;border:1px solid #333}
#block{width:90px;height:22px;background:#FFD700;position:absolute;bottom:24px;left:0;border-radius:100px;box-shadow:0 0 15px #FFD700}
.coin{width:50px;height:50px;background:radial-gradient(circle,#FFE88A,#FFD700);border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 20px #FFD700;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer}
.small{font-size:11px;color:#ffffff88}
</style>
</head>
<body>
<div class="header">
<h1>👑 YorrOfficial</h1>
<p style="color:#ffffff66;font-size:11px;letter-spacing:3px">V7 • TAP KOIN • BANYAK PILIHAN GAME</p>
</div>

<div class="bento">
<div class="card gold full"><h3 style="font-size:12px;color:#0008">GAME CENTER</h3><h2 style="color:#000">🎮 GAME YORR - TAP! (BANYAK GAME DI DALEM)</h2></div>
</div>

<div class="bento" style="padding-top:0">
<div class="card full" id="game">
<h3>🎮 PILIH GAME DI BAWAH - SEMUA BISA DIPENCET!</h
