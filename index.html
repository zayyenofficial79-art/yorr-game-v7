<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YorrOfficial V7</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0e0e0e;color:#fff;padding:14px}
.header{text-align:center;padding:20px 0}
.header h1{color:#FFD700;font-size:34px}
.card{background:#1c1c1c;border:1px solid #333;border-radius:22px;padding:16px;margin-bottom:12px}
.gold{background:#FFD700 !important;color:#000 !important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn-game{background:#000;border:2px solid #FFD700;color:#FFD700;border-radius:16px;padding:14px;text-align:center;font-weight:900;cursor:pointer}
.btn-game.active{background:#FFD700;color:#000}
.gamebox{width:100%;height:300px;background:#000;border-radius:18px;margin-top:12px;position:relative;border:2px solid #222;overflow:hidden}
#coin{width:70px;height:70px;background:radial-gradient(circle,#FFE88A,#FFD700);border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 0 20px #FFD700;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
#block{width:80px;height:20px;background:#FFD700;position:absolute;bottom:20px;left:0;border-radius:20px;display:none}
.btn{width:100%;padding:14px;border-radius:100px;border:none;font-weight:900;margin-top:10px}
</style>
</head>
