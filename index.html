<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YorrOfficial - SELAMAT DATANG DI WEBSITE YORROFFICIAL</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{min-height:100vh;color:#fff;overflow-x:hidden;background:#0f0f0f}
/* ANIME BERGERAK BACKGROUND - TERANG */
.anime-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.anime-bg::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,#FFE082,#FFD54F,#FFECB3,#FFF8E1);background-size:300% 300%;animation:gerak 8s ease infinite}
.anime-bg::after{content:'';position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=800') center/cover;opacity:0.35;mix-blend-mode:overlay;animation:zoom 20s ease-in-out infinite}
@keyframes gerak{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes zoom{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.overlay{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,0.7) 0%,rgba(255,248,225,0.85) 100%);backdrop-filter:blur(2px)}
.content{position:relative;z-index:2;padding:14px}
.header{text-align:center;padding:20px 0}
.header h1{font-size:36px;font-weight:900;color:#000;text-shadow:0 2px 10px #FFD70088}
.header h1 span{color:#FF8F00}
.header p{color:#000;font-weight:800;font-size:12px;letter-spacing:1px;margin-top:6px;background:#FFD700;padding:6px 14px;border-radius:100px;display:inline-block}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);border:2px solid #FFD700;border-radius:26px;padding:18px;box-shadow:0 8px 32px rgba(0,0,0,0.1);color:#000}
.card.full{grid-column:1 / span 2}
.btn-menu{width:100%;padding:16px;border-radius:18px;border:none;font-weight:900;font-size:15px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;transition:0.2s}
.btn-menu:active{transform:scale(0.96)}
.gold{background:linear-gradient(135deg,#FFD700,#FFB300);color:#000;box-shadow:0 8px 20px #FFD70066}
.white{background:#fff;color:#000;border:2px solid #FFD700}
.btn{width:100%;padding:14px;border-radius:100px;border:none;font-weight:900;margin-top:10px;cursor:pointer}
.btn-gold{background:linear-gradient(135deg,#FFD700,#FFB300);color:#000}
.btn-wa{background:#25D366;color:#fff}
.btn-dark{background:#000;color:#FFD700}
input{width:100%;padding:14px;border-radius:100px;background:#fff;border:2px solid #FFD700;color:#000;margin-top:10px;font-weight:600}
.gamebox{width:100%;height:300px;background:radial-gradient(circle at center,#FFF8E1,#FFE082);border-radius:22px;margin-top:12px;position:relative;border:3px solid #FFD700;overflow:hidden}
#coin{width:75px;height:75px;background:radial-gradient(circle at 30% 30%,#FFF9C4,#FFD700,#FF8F00);border-radius:50%;position:absolute;left:110px;top:110px;display:flex;align-items:center;justify-content:center;font-size:34px;border:3px solid #000;box-shadow:0 8px 20px #FF8F00aa;cursor:pointer;user-select:none}
.small{font-size:11px;color:#666;margin-top:6px}
.hide{display:none}
.show{display:block}
</style>
</head>
<body>
<div class="anime-bg"></div>
<div class="overlay"></div>
<div class="content">
<div class="header">
<h1>👑 <span>YorrOfficial</span></h1>
<p>SELAMAT DATANG DI WEBSITE YORROFFICIAL</p>
</div>

<div class="bento">
<button class="btn-menu gold full" onclick="openTab('game')">🖥️ Menu Game YorrOffc •
