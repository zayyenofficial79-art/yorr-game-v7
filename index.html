<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YorrOfficial</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
@keyframes gerakBg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body{
  background: linear-gradient(120deg,#FFF9C4,#FFD54F,#FFE082,#FFF8E1,#FFECB3);
  background-size:400% 400%;
  animation:gerakBg 10s ease infinite;
  min-height:100vh;
  padding:12px;
}
.header{text-align:center;padding:18px;background:#fff;border:3px solid #FFD700;border-radius:22px;box-shadow:0 6px 20px rgba(255,193,7,0.3)}
.header h1{font-size:32px;color:#000}
.header p{background:#FFD700;color:#000;font-weight:900;font-size:12px;padding:6px 12px;border-radius:100px;display:inline-block;margin-top:6px}
.menu{display:grid;gap:10px;margin-top:14px}
.btn{width:100%;padding:16px;border-radius:18px;border:3px solid #FFD700;font-weight:900;font-size:15px;text-align:left}
.btn:active{transform:scale(0.97)}
.btn-gold{background:#FFD700;color:#000}
.btn-white{background:#fff;color:#000}
.card{background:#fff;border:3px solid #FFD700;border-radius:22px;padding:14px;margin-top:12px;box-shadow:0 6px 20px rgba(0,0,0,0.08)}
.hide{display:none}
.gamebox{width:100%;height:280px;background:#FFF8E1;border:3px dashed #FFB300;border-radius:18px;position:relative;margin-top:10px;overflow:hidden}
#coin{width:75px;height:75px;background:gold;border-radius:50%;border:3px solid #000;position:absolute;left:100px;top:100px;font-size:32px}
input{width:100%;padding:12px;border-radius:100px;border:2px solid #FFD700;margin-top:8px}
.btn-action{width:100%;padding:13px;border-radius:100px;border:none;font-weight:900;margin-top:8px}
</style>
</head>
<body>

<div class="header">
<h1>👑 YorrOfficial</h1>
<p>SELAMAT DATANG DI WEBSITE YORROFFICIAL</p>
</div>

<div class="menu">
<button type="button" class="btn btn-gold" onclick="buka('game')">🖥️ Menu Game YorrOffc</button>
<button type="button" class="btn btn-white" onclick="buka('owner')">🎀 Owner Web</button>
<button type="button" class="btn btn-white" onclick="buka('music')">🎧 Music Menu
