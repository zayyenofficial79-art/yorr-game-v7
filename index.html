body{background:#FFF8E1;color:#000;padding:14px}
.header{text-align:center;padding:20px 0;background:#fff;border-radius:22px;border:2px solid #FFD700;box-shadow:0 4px 20px #FFD70033}

.btn-menu{width:100%;padding:18px 20px;border-radius:20px;border:2px solid #FFD700;background:#fff;color:#000;font-size:16px;font-weight:900;text-align:left;display:flex;gap:12px;box-shadow:0 4px 12px #00000011}
.btn-menu.gold{background:linear-gradient(135deg,#FFD700,#FFE88A);color:#000;border:none}
.card{background:#fff;border:2px solid #FFD700;border-radius:22px;padding:16px;margin-top:14px;display:none;box-shadow:0 8px 24px #00000012}
.card.show{display:block}
