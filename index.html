<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:url('https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=1000') center/cover;opacity:0.15;filter:blur(8px);z-index:0}
.wrap{position:relative;z-index:1;padding:12px;padding-bottom:110px;max-width:480px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.anime-btn{background:rgba(255,255,255,0.08);border:1px solid #FFD70033;border-radius:16px;padding:8px 14px;font-size:10px;font-weight:800;color:#FFD700;text-align:center;line-height:1}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#FFD700,#FF8F00);border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:22px;box-shadow:0 4px 15px #FFD70055}
.logo h2{font-size:16px;font-weight:800}
.logo p{font-size:11px;color:#aaa}
.level{background:rgba(255,215,0,0.15);border:1px solid #FFD70044;padding:6px 14px;border-radius:100px;font-size:12px;font-weight:800;color:#FFD700}
.crown{width:36px;height:36px;background:rgba(255,215,0,0.15);border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid #FFD70044}
.score-pill{margin-top:14px;background:rgba(20,20,20,0.9);border:1px solid #FFD70022;border-radius:100px;padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:12px;backdrop-filter:blur(20px)}
.score-pill .y{width:36px;height:36px;background:linear-gradient(135deg,#FFD700,#FF8F00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000}
.score-pill b{font-size:28px;letter-spacing:1px}
