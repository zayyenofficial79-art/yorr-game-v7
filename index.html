<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YorrOfficial V7 Anime Live 👑</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#000;color:#fff;overflow-x:hidden}
/* ANIME GERAK BACKGROUND - BUNDA YORR */
.anime-bg{position:fixed;inset:0;z-index:0}
.anime-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(0.35) saturate(1.3) blur(0px);animation:zoom 20s ease-in-out infinite alternate}
@keyframes zoom{0%{transform:scale(1)}100%{transform:scale(1.15)}}
.overlay{position:absolute;inset:0;background:radial-gradient(circle at 50% 10%,transparent 10%,#000 90%),linear-gradient(180deg,#00000055,#000 95%)}
.glow{position:absolute;top:15%;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(circle,#FFD70018,transparent 65%);animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-25px)}}
.header{position:relative;z-index:2;text-align:center;padding:28px 20px 10px}
.header h1{font-size:44px;font-weight:900;letter-spacing:-1px}
.header h1 span{background:linear-gradient(180deg,#FFE55C,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 25px #FFD700aa)}
.header p{color:#ffffff88
